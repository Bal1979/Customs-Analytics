name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]   # baseline (se .python-version)
    steps:
      - uses: actions/checkout@v4
      # Gelænder fra auth-konsolideringen (2026-09-11): balai_auth hentes som pinnet
      # pakke — en re-vendoret kopi vil rådne og genindføre driften.
      - name: Gelænder — vendored balai_auth må ikke genopstå
        run: |
          if [ -d "balai_auth" ]; then
            echo "::error::balai_auth/ er re-vendoret. Brug den pinnede pakke i requirements.txt (se balai-platform/AUTH-DRIFT-og-konsolidering.md)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # balai-auth er et privat repo; pin'en i requirements.txt bruger
      # ${GITHUB_TOKEN}, som pip udvider fra miljøet. Kræver repo-secret
      # BALAI_AUTH_TOKEN (fine-grained PAT, read-only Contents, Bal1979/balai-auth).
      - name: Installér afhængigheder
        env:
          GITHUB_TOKEN: ${{ secrets.BALAI_AUTH_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Kør tests
        run: pytest -q
      - name: Uafhængig valideringssuite (gate)
        # Bekræfter at hver implementeret kontrol fyrer på sit defekt-scenarie.
        # --quiet → kun exit-kode (0 = bestået). Porten fejler bygget hvis ikke.
        run: python -m validation.run_validation --quiet

  audit:
    name: pip-audit (sårbarheder i afhængigheder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installér pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
      - name: Audit pinnede runtime-afhængigheder
        # Fejler bygget hvis en runtime-pakke har en kendt sårbarhed.
        # Skal en konkret advisory midlertidigt ignoreres, tilføj:
        #   --ignore-vuln GHSA-xxxx-xxxx-xxxx
        # pip-audit resolver requirements.txt og skal kunne hente privat balai-auth.
        env:
          GITHUB_TOKEN: ${{ secrets.BALAI_AUTH_TOKEN }}
        run: pip-audit -r requirements.txt --strict
